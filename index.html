for(let i=0;i<7;i++)b+=`<rect x='${(i*61)%300+20}' y='${312+i*14}' width='${60+i*8}' height='3' rx='1.5' fill='#ffd27a' opacity='.5'/>`;

b+=`<text x='200' y='190' text-anchor='middle' font-family='Plus Jakarta Sans,system-ui,sans-serif' font-size='64' font-weight='700' fill='none' stroke='hsl(${h} 90% 65%)' stroke-width='2.5' style='animation:tw 3s ease-in-out infinite'>LIVE</text><rect y='300' width='400' height='16' fill='#2a1d18'/>`;for(let i=0;i<5;i++)b+=`<rect x='${50+i*68}' y='268' width='22' height='34' rx='4' fill='hsl(38 85% 52%)'/><rect x='${50+i*68}' y='262' width='22' height='9' rx='4' fill='#f5f7fa'/>`;for(let i=0;i<4;i++)b+=`<ellipse cx='${60+i*93}' cy='370' rx='24' ry='8' fill='#5a1f1a'/><rect x='${57+i*93}' y='378' width='6' height='60' fill='#2a1d18'/>`}
else{b=`<rect width='400' height='700' fill='#0B0D10'/><circle cx='200' cy='170' r='170' fill='hsl(${h} 70% 35% / .35)'/>`+bm(110,0,h)+bm(200,.9,h+60)+bm(290,1.8,h+120)+`<rect x='50' y='100' width='300' height='8' rx='4' fill='#262B36'/><circle cx='200' cy='226' r='16' fill='#1c2028'/><path d='M181 226a19 19 0 0138 0' fill='none' stroke='#D4AF37' stroke-width='4'/><rect x='177' y='244' width='46' height='50' rx='16' fill='#1c2028'/><rect x='118' y='290' width='164' height='44' rx='6' fill='#15181E' stroke='#262B36'/>`+dc(156)+dc(244)+cr(360,'#06080a');

function auth(){const R=S.reg;if(S.step==0)return`<div class="pad"><h2>Benvenuto</h2><p class="mu" style="margin-bottom:18px">Registrati per entrare. Scegli il tuo ruolo.</p>

${dj?`<label>Attrezzatura</label><select id="x1"><option>Solo chiavette USB</option><option>Console propria</option></select><label>Chi sei (descrizione)</label><input id="x2" placeholder="Il tuo stile, la tua storia"><label>Dove hai già suonato (separa con virgole)</label><input id="x3" placeholder="Locale 1, Locale 2"><label>Link social / SoundCloud</label><input placeholder="soundcloud.com/...">`:`<label>Tipologia</label><select id="x1"><option>Lounge Bar</option><option>Pub</option><option>Club/Discoteca</option><option>Lido</option></select><label>Capienza indicativa</label><input id="x2" type="number" value="200"><label>Attrezzatura in console</label><input id="x6" placeholder="Es. CDJ, mixer, impianto"><label>Descrizione del locale</label><input id="x3" placeholder="Atmosfera, pubblico, serate"><label>Indirizzo esatto</label><input id="x4" placeholder="Via, numero, città"><label>Indicazioni per arrivare</label><input id="x5" placeholder="Parcheggio, punti di riferimento">`}
<button class="btn" onclick="fin()">Entra in CueSpot</button></div>`}
function s1(){if(!S.role)return alert('Scegli il tuo ruolo');const n=$('#nm').value.trim();if(!n)return alert('Inserisci il nome');S.reg.e=$('#em').value.trim();S.reg.p=$('#pw').value;if(S.srv&&(!S.reg.e.includes('@')||S.reg.p.length<6))return alert('Inserisci email valida e password di almeno 6 caratteri');S.reg.n=n;S.reg.c=$('#ct').value;S.step=1;app()}
function tg(x){const g=S.reg.g,i=g.indexOf(x);i<0?g.push(x):g.splice(i,1);app()}
async function fin(){const cp=($('#x2')||{}).value;fin0();if(S.me.role=='loc'){S.me.t=S.me.gear;S.me.cap=cp}if(!S.srv)return;try{const j=await api('/register','POST',{email:S.reg.e,password:S.reg.p,role:S.me.role,profile:S.me});S.tok=j.token;S.uid=j.uid;sv0();startPoll();if(j.recovery)alert('Il tuo codice di recupero: '+j.recovery+'\n\nSalvalo: serve per reimpostare la password se la dimentichi.')}catch(e){if(e.st){S.me=null;S.step=0;alert(e.message);app()}}}
function fin0(){const R=S.reg;S.me={role:S.role,name:R.n,c:R.c,g:R.g.length?R.g:['House'],r:R.r,gear:$('#x1').value,bio:S.role=='dj'?$('#x2').value:$('#x3').value,played:S.role=='dj'?$('#x3').value.split(',').map(s=>s.trim()).filter(Boolean):[],addr:S.role=='loc'?$('#x4').value:'',rd:S.role=='loc'?$('#x6').value:'',usb:1,own:1,dir:S.role=='loc'?$('#x5').value:'',free:new Set(),reels:[],gigs:[],media:0,h:45};S.tab=0;S.F={c:R.c,r:R.r,g:'',d:''};app()}

function view(){const dj=S.me.role=='dj';if(S.tab==0)return feed(dj);if(S.tab==1)return dj?`<div class="pad"><h2>Cerca serate</h2><p class="mu">Locali nel tuo raggio che cercano un DJ</p>${flt()}<label>Cachet minimo</label><select onchange="S.F.m=+this.value;res()">${[0,80,100,150,200].map(m=>`<option value="${m}" ${S.F.m==m?'selected':''}>${m?'€'+m+'+':'Tutti'}</option>`).join('')}</select><label>Data</label><input type="date" id="fd" value="${S.F.d}" onchange="S.F.d=this.value;res()"><div id="res"></div></div>`:`<div class="pad"><h2>Cerca DJ</h2><p class="mu" style="margin-bottom:10px">Per data e zona</p><label>Città</label><select id="fc" onchange="S.F.c=this.value;res()">${Object.keys(C).map(c=>`<option ${S.F.c==c?'selected':''}>${c}</option>`).join('')}</select><label>Raggio: <b id="fr" style="color:var(--ac)">${S.F.r} km</b></label><input type="range" min="5" max="150" value="${S.F.r}" oninput="S.F.r=+this.value;$('#fr').textContent=this.value+' km';res()"><label>Genere</label><select onchange="S.F.g=this.value;res()"><option value="">Tutti</option>${G.map(g=>`<option ${S.F.g==g?'selected':''}>${g}</option>`).join('')}</select>${flt()}<label>Data</label><input type="date" value="${S.F.d}" onchange="S.F.d=this.value;res()"><div id="res"></div></div>`;
if(S.tab==2)return dj?calDJ():pubV();if(S.tab==3&&dj)return reelV();return prof(dj)}

function feed(dj){if(dj)return feedDJ();const me=S.me;let L=dj?VEN.filter(v=>dist(me.c,v.c)<=me.r).map(v=>[v,dist(me.c,v.c)]):DA().filter(d=>dist(me.c,d.c)<=me.r).map(d=>[d,dist(me.c,d.c)]);L=L.filter(a=>!S.blk.has(a[0].id));L.sort((a,b)=>a[1]-b[1]);L=L.flatMap(([x,k])=>{const n=(x.m||[]).filter(r=>r&&r.u).length;return x.id=='dme'&&n>1?Array.from({length:n},(_,i)=>[x,k,i]):[[x,k,0]]});
if(!L.length)return`<div class="pad mu">Nessun risultato entro ${me.r} km. Aumenta il raggio dal profilo.</div>`;
return`<div class="feed">${L.map(([x,k,mi])=>`<div class="slide" style="${bg(x.h)}">${mm(x,mi)}<div class="pg"></div><span class="badge" style="position:absolute;top:14px;left:16px;background:rgba(11,13,16,.6)">● Spot</span><div class="ov"><h2>${esc(x.n)}</h2><div class="mu" style="margin-bottom:6px">${dj?x.t+' · '+x.c:x.g.join(' · ')} · ${k} km · ${sv(x.id)}</div>
${dj?(x.gigs.length?`<span class="badge">Cerca DJ a breve</span><span class="badge">${dl(x.gigs[0].d)} · ${x.gigs[0].g}</span>`:''):([...x.free].some(wk)?'<span class="badge">Disponibile questo weekend</span>':'')}
<div class="row" style="margin-top:10px"><button class='btn g' style='flex:0 0 52px' data-id='${x.id}' onclick='fav(this)'>${S.fav.has(x.id)?'♥':'♡'}</button><button class="btn g" onclick="sheet('${x.id}')">Profilo</button><button class="btn" onclick="openChat('${x.id}')">${dj?'Contatta':'Proponi serata'}</button></div></div></div>`).join('')}</div>`}

function feedDJ(){const me=S.me,L=[];V().forEach(v=>{const k=dist(me.c,v.c);if(k<=me.r&&!S.blk.has(v.id))v.gigs.forEach(g=>L.push([v,g,k]))});L.sort((a,b)=>a[1].d.localeCompare(b[1].d));
if(!L.length)return`<div class="pad mu">Nessun locale cerca DJ entro ${me.r} km. Aumenta il raggio dal profilo.</div>`;
return`<div class="feed">${L.map(([v,g,k],ix)=>{const ok=S.applied.has(v.id+g.d),fr=me.free.has(g.d);return`<div class="slide" style="${pic(v.h)}">${vm(v,ix)}<span class="badge" style="position:absolute;top:14px;left:16px;background:rgba(11,13,16,.6)">Foto della serata</span><div class="ov"><span class="badge">Cercano DJ</span><h2 style="margin-top:4px">${esc(v.n)}</h2><div class="mu" style="margin-bottom:8px">${esc(v.t)} · ${v.c} · ${k} km · ${sv(v.id)}</div><div class="card" style="background:rgba(21,24,30,.85);margin-bottom:10px"><div class="mu">Tipo di serata</div><b>${esc(g.t||'Serata')}</b><div class="row" style="margin-top:8px"><div><div class="mu">Genere richiesto</div><b style="color:var(--ac)">${esc(g.g)}</b></div><div><div class="mu">Giorno e orario</div><b>${dl(g.d)} · ${g.o||'da definire'}</b></div></div><div style="margin-top:8px"><span class="mu">Cachet</span> <b style="color:var(--ac)">€${g.c||'da concordare'}</b></div>${rdr(v)}</div>${g.n>1?'<span class="badge">Line-up '+g.n+' DJ</span>':''}${fr?'<span class="badge">Sei libero quel giorno</span>':'<span class="badge" style="border-color:var(--mu);color:var(--mu)">Non segnato come libero</span>'}<div class='row' style='margin-top:8px'><button class='btn g' onclick='serata("${v.id}","${g.d}")'>Dettagli serata</button><button class='btn g' onclick='sheet("${v.id}")'>Descrizione locale</button></div><div class="row" style="margin-top:8px"><button class='btn g' style='flex:0 0 52px' data-id='${v.id}' onclick='fav(this)'>${S.fav.has(v.id)?'♥':'♡'}</button><button class="btn" ${ok?'disabled':''} onclick="applyF('${v.id}','${g.d}',this)">${ok?'Candidatura inviata':'Candidati'}</button></div></div></div>`}).join('')}</div>`}
function applyF(v,d,b){reqApp(v,d);const g=find(v).gigs.find(a=>a.d==d);say(v,`Ciao! Mi candido per ${g.t||'la serata'} del ${dl(d)} (${g.g}, ${g.o||''}). Ti allego profilo e spot.`);b.disabled=true;b.textContent='Candidatura inviata'}
function res(){const el=$('#res');if(!el)return;const dj=S.me.role=='dj',me=S.me,F=S.F,cn={};let h='';
if(dj){const rows=[];V().forEach(v=>{const k=dist(me.c,v.c);if(k>me.r)return;v.gigs.forEach(g=>{if((!F.d||g.d==F.d)&&(g.c||0)>=(F.m||0))rows.push([v,g,k])})});rows.sort((a,b)=>a[1].d.localeCompare(b[1].d));
rows.splice(0,rows.length,...xf(rows,1));rows.forEach(r=>cn[r[0].c]=(cn[r[0].c]||0)+1);h=rows.map(([v,g,k])=>{const id=v.id+g.d,ok=S.applied.has(id);return`<div class="card"><h3>${esc(v.n)}</h3><div class="mu">${v.t} · ${v.c} · ${k} km · ${sv(v.id)}</div><div style="margin:8px 0"><span class="badge">${dl(g.d)}</span><span class="badge">${esc(g.g)}</span><span class="badge">${g.o||''}</span><span class="badge">${esc(g.t||'')}</span><span class="badge">€${g.c||'—'}</span>${me.free.has(g.d)?'<span class="badge">Sei libero</span>':''}</div><button class='btn g s' onclick='serata("${v.id}","${g.d}")'>Dettagli serata</button> <button class="btn s" ${ok?'disabled':''} onclick="apply('${v.id}','${g.d}')">${ok?'Candidatura inviata':'Candidati con un clic'}</button></div>`}).join('')}
else{const rows=DA().filter(d=>{const k=dist(F.c,d.c);return k<=F.r&&(!F.g||d.g.includes(F.g))&&(!F.d||d.free.has(F.d))}).map(d=>[d,dist(F.c,d.c)]).sort((a,b)=>a[1]-b[1]);
rows.splice(0,rows.length,...xf(rows,0));rows.forEach(r=>cn[r[0].c]=(cn[r[0].c]||0)+1);h=rows.map(([d,k])=>`<div class="card"><h3>${esc(d.n)}</h3><div class="mu">${d.g.join(' · ')} · ${d.c} · ${k} km · ${sv(d.id)}</div><div class="mu" style="margin:4px 0 10px">${d.gear}</div><div class="row"><button class='btn g s' style='flex:0 0 48px' data-id='${d.id}' onclick='fav(this)'>${S.fav.has(d.id)?'♥':'♡'}</button><button class="btn g s" onclick="sheet('${d.id}')">Profilo</button><button class="btn s" onclick="openChat('${d.id}')">Proponi serata</button></div></div>`).join('')}
if(!h)h='<div class="mu" style="padding:12px 0">Nessun risultato per questi filtri.</div>';el.innerHTML=mapV(cn,dj?me.c:F.c,dj?me.r:F.r)+h;0||'<div class="mu" style="padding:12px 0">Nessun risultato per questi filtri.</div>'}
